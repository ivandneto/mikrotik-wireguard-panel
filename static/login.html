<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · WG Panel</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 flex items-center justify-center p-4">
  <form id="form" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-5 shadow-2xl">
    <div class="text-center space-y-1">
      <div class="text-4xl">🛡️</div>
      <h1 class="text-xl font-semibold text-white">MikroTik WG Panel</h1>
      <p class="text-sm text-slate-400">VPN WireGuard · Liberação de portas · Monitoramento</p>
    </div>
    <label class="block">
      <span class="label">Usuário</span>
      <input name="username" class="input" autocomplete="username" required autofocus>
    </label>
    <label class="block">
      <span class="label">Senha</span>
      <input name="password" type="password" class="input" autocomplete="current-password" required>
    </label>
    <p id="error" class="text-sm text-red-400 hidden"></p>
    <button class="btn-primary w-full justify-center py-2.5">Entrar</button>
    <label class="flex items-center justify-center gap-2 text-sm text-slate-400" title="Idioma / Language">🌐
      <select id="lang" class="bg-transparent outline-none cursor-pointer"></select>
    </label>
  </form>
  <script>
    const sel = document.getElementById('lang');
    for (const l of LANGS) sel.add(new Option(l.name, l.code, false, l.code === LANG));
    sel.addEventListener('change', () => setLang(sel.value));
    document.getElementById('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const err = document.getElementById('error');
      err.classList.add('hidden');
      const body = Object.fromEntries(new FormData(ev.target));
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-Lang': LANG}, body: JSON.stringify(body),
      });
      if (r.ok) { location.href = '/'; return; }
      const data = await r.json().catch(() => ({}));
      err.textContent = data.detail || t('Falha no login');
      err.classList.remove('hidden');
    });
  </script>
</body>
</html>
