services:
  wgpanel:
    # Com a imagem da Release carregada (docker load), o compose usa ela direto.
    # Com o código-fonte, "docker compose up -d --build" gera a imagem localmente.
    image: wgpanel:latest
    build: .
    container_name: wgpanel
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
