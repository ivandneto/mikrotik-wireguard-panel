services:
  wgpanel:
    # With the Release image loaded (docker load), compose uses it directly.
    # From source, "docker compose up -d --build" builds the image locally.
    image: wgpanel:latest
    build: .
    container_name: wgpanel
    restart: unless-stopped
    env_file: .env
    environment:
      # Your time zone (used in charts, events and alerts)
      - TZ=America/Sao_Paulo
    ports:
      # ⚠️ Security: do not create a port forward to this port on the MikroTik.
      # To publish it only on the local network, use "THIS-MACHINE-IP:8080:8080" (e.g. "192.168.88.61:8080:8080")
      # or "127.0.0.1:8080:8080" if only this computer will open the panel. See SECURITY.md.
      - "8080:8080"
    volumes:
      - ./data:/data
